<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Yappo!</title>

    <link rel="stylesheet" href="style.css">

</head>


<body class="login-page">


<div class="login-container">


    <div class="login-box">

        <a href="index.html" class="logo login-logo">
            Yappo<span>.</span>
        </a>


        <h1>
            Welcome back.
        </h1>

        <p class="login-subtitle">
            To get further experience LOGIN Fast!!
        </p>


        <form>

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >


            <div class="login-options">

                <label class="remember">

                    <input type="checkbox">

                    Remember me

                </label>

                <a href="#">
                    Forgot password?
                </a>

            </div>


            <button type="submit" class="login-submit">
                Login →
            </button>

        </form>


        <div class="divider">
            <span>OR</span>
        </div>


        <button class="google-btn">
            Continue with Google
        </button>


        <p class="signup-text">

            Don't have an account?

            <a href="#">
                Sign Up
            </a>

        </p>


        <a href="index.html" class="back-home">
            ← Back to home
        </a>

    </div>

</div>

</body>

</html>
